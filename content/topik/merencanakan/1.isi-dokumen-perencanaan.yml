kunci: isi-dokumen-perencanaan
slug: isi-dokumen-perencanaan
tahap: merencanakan
judul: Isi dokumen perencanaan
ringkasan: Dokumen perencanaan boleh berupa RPP atau modul ajar. Apa pun bentuknya, isinya paling sedikit tujuan, langkah, dan asesmen pembelajaran.
ikon: 018-notes.svg
terkait: [tujuan-pembelajaran, merencanakan-asesmen, langkah-pembelajaran]
butir:
  - kunci: memuat-tujuan
    judul: Pastikan dokumenmu memuat tujuan pembelajaran
    penjelasan: Tujuan pembelajaran adalah kompetensi dan konten pada ruang lingkup materi yang harus dicapai murid.
    dasar:
      - Permendikdasmen 1/2026 Pasal 5 huruf a dan Pasal 6 ayat 1

  - kunci: memuat-langkah
    judul: Pastikan dokumenmu memuat langkah pembelajaran
    penjelasan: Langkah pembelajaran adalah tahapan yang memberi murid pengalaman belajar untuk mencapai tujuan.
    dasar:
      - Permendikdasmen 1/2026 Pasal 5 huruf b dan Pasal 7 ayat 1

  - kunci: memuat-asesmen
    judul: Pastikan dokumenmu memuat asesmen pembelajaran
    penjelasan: Asesmen memakai teknik dan instrumen yang beragam dan sesuai dengan tujuan pembelajaran.
    dasar:
      - Permendikdasmen 1/2026 Pasal 5 huruf c dan Pasal 8 ayat 1

  - kunci: bentuk-sederhana
    judul: Susun dokumen yang fleksibel, jelas, dan sederhana
    penjelasan: Bentuknya boleh RPP atau modul ajar. Dokumen ini dibuat untuk memandu kamu mengajar sehari-hari.
    dasar:
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, Bab Perencanaan, C.1 Perencanaan Pembelajaran

  - kunci: berdasarkan-alur
    judul: Susun perencanaan berdasarkan alur tujuan pembelajaran
    penjelasan: Alur tiap guru bisa berbeda, jadi perencanaanmu boleh berbeda dari guru lain di fase yang sama. Sesuaikan dengan murid, lingkungan sekolah, dan sarana yang tersedia.
    dasar:
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, Bab Perencanaan, C.1 Perencanaan Pembelajaran

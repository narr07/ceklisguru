kunci: alur-tujuan-pembelajaran
slug: alur-tujuan-pembelajaran
tahap: merencanakan
judul: Alur tujuan pembelajaran
ringkasan: Alur tujuan pembelajaran adalah tujuan-tujuan yang diurutkan dalam satu fase, bukan turunan atau rincian dari tujuan.
ikon: ceklis:015-map
terkait: [tujuan-pembelajaran, isi-dokumen-perencanaan]
butir:
  - kunci: urutkan-bukan-rinci
    judul: Urutkan tujuan, jangan memecahnya menjadi rincian
    penjelasan: Alur berisi tujuan pembelajaran yang diurutkan dan berfokus pada pencapaian pembelajaran.
    dasar:
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, B.2 Menyusun Alur Tujuan Pembelajaran

  - kunci: per-fase-per-tahun
    judul: Susun alur per fase, lalu tetapkan per tahun
    penjelasan: Alur dikembangkan untuk satu fase utuh, kemudian dibagi dan ditetapkan untuk setiap tahun.
    dasar:
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, B.2 Menyusun Alur Tujuan Pembelajaran

  - kunci: susun-bersama
    judul: Susun alur bersama guru lain
    penjelasan: Ajak guru lintas kelas di fase yang sama, atau susun bersama KKG, MGMP, atau komunitas belajar di sekolahmu.
    dasar:
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, B.2 Menyusun Alur Tujuan Pembelajaran

  - kunci: cara-mengurutkan
    judul: Pilih cara mengurutkan yang cocok dengan mata pelajaranmu
    penjelasan: Alur disusun sesuai karakteristik dan kompetensi yang dikembangkan di tiap mata pelajaran.
    catatan: "Cara mengurutkan di Panduan: dari konkret ke abstrak, deduktif (dari umum ke khusus), dari mudah ke sulit, hierarki, prosedural, dan scaffolding."
    contoh: "Contoh di Panduan. Hierarki: murid belajar penjumlahan dulu sebelum memahami perkalian. Dari mudah ke sulit: murid belajar mengeja kata pendek sebelum kata yang lebih panjang."
    dasar:
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, Tabel 3.3 Cara-Cara Menyusun Alur Tujuan Pembelajaran

  - kunci: sesuaikan-contoh
    judul: Pakai contoh alur dari pemerintah sebagai titik awal, lalu sesuaikan
    penjelasan: Contoh alur dari pemerintah boleh diubah sesuai kebutuhan murid dan kesiapan sekolah. Pemerintah tidak menetapkan format komponennya.
    dasar:
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, B.2 Menyusun Alur Tujuan Pembelajaran

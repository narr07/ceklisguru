kunci: suasana-belajar
slug: suasana-belajar
tahap: melaksanakan
judul: Suasana belajar
ringkasan: Pembelajaran berlangsung dalam suasana yang interaktif, inspiratif, menyenangkan, menantang, dan memotivasi, di lingkungan yang aman, nyaman, dan inklusif.
ikon: 006-balloons.svg
terkait: [peran-guru-di-kelas, prinsip-pembelajaran]
butir:
  - kunci: interaktif-inspiratif
    judul: Ciptakan suasana belajar yang interaktif dan inspiratif
    penjelasan: Fasilitasi interaksi antara guru dan murid, antarmurid, dan antara murid dengan materi belajarnya.
    dasar:
      - Permendikdasmen 1/2026 Pasal 9 ayat 1 huruf a dan b
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, Contoh Pelaksanaan Prinsip Menggembirakan

  - kunci: menyenangkan-menantang
    judul: Buat pembelajaran menyenangkan sekaligus menantang
    penjelasan: Beri dukungan dan tantangan yang sesuai kemampuan murid, supaya mereka merasakan keberhasilan belajar.
    dasar:
      - Permendikdasmen 1/2026 Pasal 9 ayat 1 huruf c dan d
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, Karakteristik Prinsip Menggembirakan

  - kunci: partisipasi-aktif
    judul: Dorong murid berpartisipasi aktif
    penjelasan: Beri murid kesempatan mengeksplorasi gagasan, berdiskusi, dan menyampaikan pendapat.
    dasar:
      - Permendikdasmen 1/2026 Pasal 9 ayat 1 huruf e
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, C.1 Perencanaan Pembelajaran bagian lingkungan pembelajaran

  - kunci: ruang-prakarsa
    judul: Beri ruang untuk prakarsa, kreativitas, dan kemandirian murid
    penjelasan: Sesuaikan dengan bakat, minat, serta perkembangan fisik dan psikologis murid.
    dasar:
      - Permendikdasmen 1/2026 Pasal 9 ayat 1 huruf f

  - kunci: aman-nyaman-inklusif
    judul: Jaga lingkungan belajar tetap aman, nyaman, dan inklusif
    penjelasan: Siapkan lingkungan yang sesuai dengan karakteristik murid dan beri ruang yang nyaman bagi keberagaman.
    contoh: "Contoh di Panduan: memotivasi murid bereksplorasi, berekspresi, dan berkolaborasi, serta memanfaatkan lingkungan sekolah dan sekitarnya, seperti perpustakaan, ruang komputer, kantin, taman sekolah, dan fasilitas umum."
    dasar:
      - Permendikdasmen 1/2026 Pasal 9 ayat 2
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, Contoh Lingkungan Pembelajaran dan Contoh Pelaksanaan Prinsip Berkesadaran

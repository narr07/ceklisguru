kunci: diferensiasi-dan-asesmen-formatif
slug: diferensiasi-dan-asesmen-formatif
tahap: melaksanakan
judul: Diferensiasi dan asesmen formatif
ringkasan: Pembelajaran dan asesmen berjalan sebagai satu siklus. Hasil asesmen dipakai untuk menyesuaikan cara belajar setiap murid.
ikon: ceklis:020-color-palette
terkait: [merencanakan-asesmen, pengalaman-belajar, melayani-keragaman-murid]
butir:
  - kunci: mulai-dari-asesmen-awal
    judul: Mulai pembelajaran dari hasil asesmen awal
    penjelasan: Pahami titik awal tiap murid, termasuk pengetahuan, potensi, dan cara belajarnya, lalu sesuaikan strategimu.
    dasar:
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, C.2 Pelaksanaan Pembelajaran dan Bab Pelaksanaan Pembelajaran dan Asesmen

  - kunci: sesuaikan-pembelajaran
    judul: Sesuaikan konten, proses, produk, atau lingkungan belajar
    penjelasan: Diferensiasi berdasarkan kesiapan, minat, dan gaya belajar murid. Rancangannya tidak harus rumit atau berbeda untuk setiap murid.
    dasar:
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, Bab Pelaksanaan Pembelajaran dan Asesmen

  - kunci: kelompok-fleksibel
    judul: Buat kelompok yang fleksibel dan sementara, tanpa memberi label
    penjelasan: Pengelompokan bukan untuk membuat peringkat kemampuan. Gilir peran dan tugas supaya setiap murid mengembangkan berbagai kompetensi.
    contoh: "Contoh di Panduan: kelompok kecil mengeksplorasi peran berbeda dalam satu proyek, membahas ide dari berbagai sudut pandang, atau mencari solusi atas masalah nyata."
    dasar:
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, Bab Pelaksanaan Pembelajaran dan Asesmen

  - kunci: pilihan-cara
    judul: Beri murid pilihan cara belajar dan cara menunjukkan pemahamannya
    penjelasan: Tetap bimbing murid merefleksikan proses belajarnya dan menyadari bagaimana ia belajar.
    contoh: "Contoh di Panduan: pilihan media belajar (artikel, video, modul, atau esai), strategi penyelesaian masalah, atau bentuk akhir tugas."
    dasar:
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, Bab Pelaksanaan Pembelajaran dan Asesmen

  - kunci: formatif-berkelanjutan
    judul: Pakai asesmen formatif sepanjang pembelajaran
    penjelasan: Pantau pemahaman murid dan beri umpan balik yang membangun. Kalau tujuan belum tercapai, beri tindak lanjut sebelum pindah ke tujuan berikutnya.
    dasar:
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, C.3 Asesmen Pembelajaran dan Bab Pelaksanaan Pembelajaran dan Asesmen

  - kunci: kompetensi-tetap-sama
    judul: Ukur kompetensi yang sama walaupun jalur belajarnya berbeda
    penjelasan: Murid boleh menempuh jalur atau menghasilkan produk yang berbeda, tapi kompetensi yang diukur tetap sama, jadi tidak perlu rubrik yang berbeda.
    dasar:
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, Bab Pelaksanaan Pembelajaran dan Asesmen

kunci: peran-guru-di-kelas
slug: peran-guru-di-kelas
tahap: melaksanakan
judul: Peran guru di kelas
ringkasan: Saat melaksanakan pembelajaran, guru memberi keteladanan, pendampingan, dan fasilitasi.
ikon: ceklis:042-user-profile
terkait: [suasana-belajar, pengalaman-belajar]
butir:
  - kunci: teladan-perilaku
    judul: Tunjukkan perilaku mulia dalam kehidupan sehari-hari
    penjelasan: Tampilkan perilaku etis dan keteladanan yang mencerminkan kematangan spiritual, moral, dan emosional.
    dasar:
      - Permendikdasmen 1/2026 Pasal 9 ayat 4 huruf a
      - Permendikdasmen 21/2025 Pasal 8 ayat 2 huruf a

  - kunci: teladan-terbuka
    judul: Bersikap terbuka, saling menghargai, dan mau bekerja bersama murid
    penjelasan: Jadilah pendengar aktif bagi murid, dan libatkan mereka dalam merancang pembelajaran.
    dasar:
      - Permendikdasmen 1/2026 Pasal 9 ayat 4 huruf b
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, Contoh Pelaksanaan Prinsip Berkesadaran dan Contoh Kemitraan Pembelajaran

  - kunci: dukung-bimbing
    judul: Beri dukungan dan bimbingan saat murid belajar
    penjelasan: Perhatikan terutama murid yang mengalami hambatan atau kesulitan belajar.
    dasar:
      - Permendikdasmen 1/2026 Pasal 9 ayat 5 huruf a
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, C.3 Asesmen Pembelajaran

  - kunci: bangun-pengetahuan
    judul: Dorong murid membangun pengetahuannya sendiri dari berbagai sumber belajar
    penjelasan: Sediakan berbagai media dan sumber belajar, lalu biarkan murid aktif mengolahnya.
    dasar:
      - Permendikdasmen 1/2026 Pasal 9 ayat 5 huruf b
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, Contoh Praktik Pedagogis

  - kunci: akses-kesempatan
    judul: Sediakan akses dan kesempatan belajar sesuai kebutuhan murid
    penjelasan: Misalnya dengan menyesuaikan alokasi waktu belajar dengan kebutuhan murid.
    dasar:
      - Permendikdasmen 1/2026 Pasal 9 ayat 6 huruf a
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, Contoh Pelaksanaan Prinsip Menggembirakan

  - kunci: strategi-sendiri
    judul: Beri ruang bagi murid menciptakan strategi belajarnya sendiri
    penjelasan: Ajak murid meneruskan strategi belajar yang berhasil dan memperbaiki yang belum berhasil.
    dasar:
      - Permendikdasmen 1/2026 Pasal 9 ayat 6 huruf b
      - Paparan Pembelajaran Mendalam, Langkah-Langkah Pembelajaran bagian Merefleksi

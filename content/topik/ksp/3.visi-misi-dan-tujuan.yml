kunci: visi-misi-dan-tujuan
slug: visi-misi-dan-tujuan
tahap: ksp
judul: Visi, misi, dan tujuan
ringkasan: Visi dan misi menjadi arahan yang disepakati seluruh warga sekolah. Tujuan sekolah adalah perwujudan visi dan misi, dan mencerminkan hasil yang akan dicapai murid.
ikon: ceklis:021-compass
terkait: [analisis-karakteristik-sekolah, pengorganisasian-pembelajaran]
butir:
  - kunci: dpl-sebagai-fondasi
    judul: Jadikan delapan dimensi profil lulusan sebagai fondasi
    penjelasan: Sekolah boleh menambahkan kompetensi murid sesuai karakteristiknya, selama tidak bertentangan dengan delapan dimensi itu.
    dasar:
      - Panduan Pengembangan Kurikulum Satuan Pendidikan edisi revisi 2025, Prinsip merumuskan tujuan yang berpusat pada murid nomor 1

  - kunci: selaras-kerangka-nasional
    judul: Pastikan visi, misi, dan tujuan selaras dengan kerangka nasional
    penjelasan: Tidak boleh bertentangan dengan tujuan pendidikan nasional dan struktur kurikulum yang ditetapkan pemerintah.
    dasar:
      - Panduan Pengembangan Kurikulum Satuan Pendidikan edisi revisi 2025, Menyelaraskan Visi, Misi, dan Tujuan

  - kunci: uji-visi-misi
    judul: Uji visi, misi, dan tujuan dengan pertanyaan pemeriksa
    penjelasan: Apakah visi berpusat pada murid dan menggambarkan harapan seluruh warga sekolah? Apakah misi jelas menyatakan yang perlu dilakukan? Apakah strategi mencapai misi realistis?
    dasar:
      - Panduan Pengembangan Kurikulum Satuan Pendidikan edisi revisi 2025, Menyelaraskan Visi, Misi, dan Tujuan

  - kunci: refleksi-berkala-dpl
    judul: Refleksikan program sekolah secara berkala dengan delapan dimensi profil lulusan
    penjelasan: Lihat sejauh mana struktur, sistem, dan kurikulum sekolah memungkinkan murid dan guru berkembang sesuai dimensi itu.
    dasar:
      - Panduan Pengembangan Kurikulum Satuan Pendidikan edisi revisi 2025, Prinsip merumuskan tujuan yang berpusat pada murid nomor 5 dan 6

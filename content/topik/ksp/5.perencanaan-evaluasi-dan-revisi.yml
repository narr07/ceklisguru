kunci: perencanaan-evaluasi-dan-revisi
slug: perencanaan-evaluasi-dan-revisi
tahap: ksp
judul: Perencanaan, evaluasi, dan revisi
ringkasan: Perencanaan, pelaksanaan, dan evaluasi kurikulum berjalan sebagai satu siklus. Pendampingan dan pengembangan profesional menjadi tindak lanjut evaluasi.
ikon: ceklis:036-review
terkait: [pengorganisasian-pembelajaran, prinsip-penyusunan-ksp, isi-dokumen-perencanaan]
butir:
  - kunci: isi-perencanaan
    judul: Susun tujuan pembelajaran, alurnya, dan pemetaan tema kokurikuler
    penjelasan: Lengkapi dengan perencanaan pembelajaran intrakurikuler (RPP atau modul ajar) dan perencanaan kokurikuler.
    dasar:
      - Panduan Pengembangan Kurikulum Satuan Pendidikan edisi revisi 2025, Komponen 4 Perencanaan Pembelajaran

  - kunci: lampirkan-contoh
    judul: Cukup lampirkan beberapa contoh perencanaan pembelajaran
    penjelasan: Sekolah boleh memakai, memodifikasi, atau mengadaptasi contoh perencanaan dari pemerintah.
    dasar:
      - Panduan Pengembangan Kurikulum Satuan Pendidikan edisi revisi 2025, Komponen 4 Perencanaan Pembelajaran

  - kunci: evaluasi-berkala
    judul: Evaluasi kurikulum secara mandiri dan berkala
    penjelasan: Evaluasi pembelajaran mengukur keberhasilan guru memfasilitasi belajar. Evaluasi KSP melihat apakah visi, misi, dan tujuan sekolah sudah tercapai.
    dasar:
      - Panduan Pengembangan Kurikulum Satuan Pendidikan edisi revisi 2025, Prinsip Evaluasi Pembelajaran dan Evaluasi Kurikulum Satuan Pendidikan

  - kunci: pendampingan-tindak-lanjut
    judul: Tindak lanjuti hasil evaluasi dengan pendampingan dan pengembangan profesional
    penjelasan: Guru bisa merefleksikan diri terhadap kriteria keberhasilan, yaitu tujuan pembelajaran, capaian pembelajaran, dan delapan dimensi profil lulusan.
    dasar:
      - Panduan Pengembangan Kurikulum Satuan Pendidikan edisi revisi 2025, Hubungan Evaluasi, Pengembangan Profesional Pendidik, dan Pendampingan

  - kunci: tinjau-dan-revisi
    judul: Tinjau dan revisi KSP yang sudah ada
    penjelasan: Mulai dari pertanyaan pemantik, misalnya apakah KSP sebelumnya sudah dievaluasi, siapa yang terlibat dalam revisi, dan apakah orang tua sudah mendapat informasi tentang kurikulum dan programnya.
    catatan: Panduan juga mengajak sekolah memeriksa hal penting dari Rapor Pendidikan yang perlu difasilitasi dalam KSP.
    dasar:
      - Panduan Pengembangan Kurikulum Satuan Pendidikan edisi revisi 2025, Proses Peninjauan dan Revisi Kurikulum Satuan Pendidikan

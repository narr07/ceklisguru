kunci: prinsip-penyusunan-ksp
slug: prinsip-penyusunan-ksp
tahap: ksp
judul: Prinsip penyusunan KSP
ringkasan: Kurikulum satuan pendidikan (KSP) adalah dokumen hidup yang mengacu pada standar dan kurikulum pemerintah, lalu diselaraskan dengan kebutuhan murid, sekolah, dan daerah.
ikon: 025-signboard.svg
terkait: [analisis-karakteristik-sekolah, visi-misi-dan-tujuan]
butir:
  - kunci: berpusat-pada-murid
    judul: Pastikan KSP berpusat pada murid
    penjelasan: Pembelajaran memenuhi keragaman potensi, kebutuhan perkembangan, tahapan belajar, dan kepentingan murid.
    dasar:
      - Panduan Pengembangan Kurikulum Satuan Pendidikan edisi revisi 2025, Prinsip Penyusunan

  - kunci: kontekstual
    judul: Sesuaikan dengan karakteristik sekolah dan daerah
    penjelasan: KSP menunjukkan diversifikasi berdasarkan karakteristik sekolah dan konteks daerah, termasuk sosial budaya dan lingkungannya. Untuk SMK, juga dunia kerja.
    dasar:
      - Panduan Pengembangan Kurikulum Satuan Pendidikan edisi revisi 2025, Prinsip Penyusunan

  - kunci: esensial-ringkas
    judul: Tulis yang penting saja, dengan bahasa yang lugas dan ringkas
    penjelasan: KSP memuat informasi utama yang dibutuhkan sekolah. Bentuk dan sistematikanya ditentukan sendiri oleh sekolah.
    catatan: Panduan menegaskan bahwa pengembangan KSP tidak menekankan pemenuhan aturan administrasi yang seragam.
    dasar:
      - Panduan Pengembangan Kurikulum Satuan Pendidikan edisi revisi 2025, Prinsip Penyusunan dan Pendahuluan

  - kunci: berbasis-data
    judul: Dasarkan isinya pada data yang aktual
    penjelasan: KSP harus bisa dipertanggungjawabkan, jadi setiap keputusan berbasis data dan kondisi nyata sekolah.
    dasar:
      - Panduan Pengembangan Kurikulum Satuan Pendidikan edisi revisi 2025, Prinsip Penyusunan (akuntabel)

  - kunci: libatkan-pemangku-kepentingan
    judul: Libatkan komite sekolah, orang tua, dan pemangku kepentingan lain
    penjelasan: Pengembangan KSP melibatkan berbagai pihak, di bawah koordinasi dan supervisi dinas pendidikan atau kantor kementerian terkait.
    dasar:
      - Panduan Pengembangan Kurikulum Satuan Pendidikan edisi revisi 2025, Prinsip Penyusunan

kunci: kolaborasi-dan-kemitraan
slug: kolaborasi-dan-kemitraan
tahap: berkembang
judul: Kolaborasi dan kemitraan
ringkasan: Guru berkolaborasi dengan murid, sesama guru, tenaga kependidikan, orang tua, dan masyarakat untuk meningkatkan kualitas pembelajaran.
ikon: ceklis:043-share
terkait: [komunitas-belajar-dan-pengembangan-diri, kerangka-pembelajaran]
butir:
  - kunci: berbagi-dengan-rekan
    judul: Berbagi praktik baik dengan rekan guru
    penjelasan: Kerja sama dengan sejawat mencakup berbagi praktik baik, merencanakan, merefleksikan, dan mengevaluasi pembelajaran bersama.
    dasar:
      - Permendikdasmen 21/2025 Pasal 8 ayat 3 huruf b
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, Contoh Kemitraan Pembelajaran huruf b

  - kunci: libatkan-orang-tua
    judul: Libatkan orang tua dalam program pembelajaran di sekolah
    penjelasan: Orang tua bisa ikut mendukung pembelajaran, misalnya menjadi guru tamu.
    dasar:
      - Permendikdasmen 1/2026 Pasal 12 ayat 3
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, Contoh Kemitraan Pembelajaran huruf c

  - kunci: mitra-luar-sekolah
    judul: Jalin kerja sama dengan pihak di luar sekolah
    penjelasan: Misalnya dunia kerja, puskesmas, lembaga lain yang terkait pembelajaran, atau perguruan tinggi.
    dasar:
      - Permendikdasmen 1/2026 Pasal 12 ayat 3
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, Contoh Kemitraan Pembelajaran huruf d dan e

  - kunci: murid-sebagai-mitra
    judul: Ajak murid bekerja sama merancang pembelajaran dan asesmen
    penjelasan: Kemitraan memindahkan kendali pembelajaran dari guru saja menjadi kolaborasi bersama.
    dasar:
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, 2. Kemitraan Pembelajaran dan contoh huruf a

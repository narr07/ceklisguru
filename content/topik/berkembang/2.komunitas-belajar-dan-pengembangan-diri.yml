kunci: komunitas-belajar-dan-pengembangan-diri
slug: komunitas-belajar-dan-pengembangan-diri
tahap: berkembang
judul: Komunitas belajar dan pengembangan diri
ringkasan: Guru berpartisipasi aktif dalam organisasi profesi dan komunitas belajar, serta terus mengembangkan praktik mengajarnya.
ikon: ceklis:038-chat
terkait: [kolaborasi-dan-kemitraan, refleksi-diri, memanfaatkan-kecerdasan-artifisial]
butir:
  - kunci: aktif-di-komunitas
    judul: Aktif di organisasi profesi dan komunitas belajar
    penjelasan: Tujuannya mengembangkan diri dan meningkatkan kualitas praktik pendidikan, misalnya lewat KKG, MGMP, atau komunitas belajar di sekolah.
    dasar:
      - Permendikdasmen 21/2025 Pasal 8 ayat 3 huruf c
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, B.2 Menyusun Alur Tujuan Pembelajaran (penyebutan MGMP, KKG, dan komunitas)

  - kunci: siklus-komunitas
    judul: Jalankan komunitas belajar dengan siklus yang jelas
    penjelasan: Mulai dari refleksi awal tentang kebutuhan belajar murid, lalu perencanaan bersama, implementasi di kelas, dan evaluasi hasilnya.
    dasar:
      - Panduan Pemanfaatan Kecerdasan Artifisial untuk Guru, Bab 6 B.3 Strategi Praktis
      - Kepmendikdasmen 126/P/2025 (Pedoman Pembelajaran Mendalam), siklus pendampingan Refleksi Awal, Perencanaan, Implementasi, dan Evaluasi

  - kunci: kembangkan-praktik
    judul: Kembangkan praktik mengajarmu secara konseptual, empiris, kreatif, dan inovatif
    penjelasan: Ini bagian dari kompetensi profesional guru.
    dasar:
      - Permendikdasmen 21/2025 Pasal 8 ayat 4 huruf e

  - kunci: kurikulum-adaptif
    judul: Terapkan dan kembangkan kurikulum secara adaptif dan kontekstual
    penjelasan: Pahami kurikulum yang berlaku, lalu sesuaikan dengan perkembangan zaman dan konteks sekolahmu.
    dasar:
      - Permendikdasmen 21/2025 Pasal 8 ayat 4 huruf d

  - kunci: belajar-sepanjang-hayat
    judul: Terus belajar dengan pola pikir bertumbuh
    penjelasan: Kompetensi kepribadian guru mencakup belajar sepanjang hayat untuk meningkatkan kualitas diri.
    dasar:
      - Permendikdasmen 21/2025 Pasal 8 ayat 2 huruf b

kunci: memahami-capaian-pembelajaran
slug: memahami-capaian-pembelajaran
tahap: memahami
judul: Memahami capaian pembelajaran
ringkasan: Capaian pembelajaran (CP) adalah kompetensi yang harus dicapai murid di akhir setiap fase. Pelajari CP mata pelajaranmu sampai tuntas sebelum menyusun tujuan.
ikon: ceklis:029-phone-book
terkait: [mengenali-murid, tujuan-pembelajaran]
butir:
  - kunci: tujuan-pendidikan-sekolah
    judul: Pahami tujuan pendidikan di jenjang dan sekolah tempat kamu mengajar
    penjelasan: Ini bagian pertama dari kompetensi profesional guru.
    dasar:
      - Permendikdasmen 21/2025 Pasal 8 ayat 4 huruf a

  - kunci: kenali-fase
    judul: Kenali fase yang kamu ampu
    penjelasan: Satu fase biasanya mencakup lebih dari satu tingkat kelas, jadi CP-nya dicapai di akhir fase, bukan di akhir setiap kelas.
    catatan: "Pembagian fase di Panduan: Fondasi (PAUD), A (kelas I-II), B (kelas III-IV), C (kelas V-VI), D (kelas VII-IX), E (kelas X), dan F (kelas XI-XII)."
    dasar:
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, A. Menganalisis Capaian Pembelajaran, Tabel 3.1

  - kunci: pakai-cp-berlaku
    judul: Pakai CP yang berlaku saat ini
    penjelasan: CP ditetapkan lewat Keputusan Kepala BSKAP Nomor 046/H/KR/2025. CP Pendidikan Agama dan Budi Pekerti sudah diubah lewat Keputusan Kepala BKPDM Nomor 020/2026.
    dasar:
      - Kepka BSKAP 046/H/KR/2025 tentang Capaian Pembelajaran
      - Kepka BKPDM 020/2026 tentang Perubahan atas Kepka BSKAP 046/H/KR/2025

  - kunci: baca-cp-utuh
    judul: Baca seluruh isi CP, bukan hanya capaian per fase
    penjelasan: CP terdiri atas rasional, tujuan, karakteristik, dan capaian per fase. Rasional juga menjelaskan kaitan mata pelajaran dengan dimensi profil lulusan.
    dasar:
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, A. Menganalisis Capaian Pembelajaran

  - kunci: kompetensi-terpadu
    judul: Pahami bahwa CP ditulis sebagai satu paragraf yang terpadu
    penjelasan: Pengetahuan, keterampilan, dan sikap dirangkai dalam satu paragraf, sehingga yang dipelajari murid menjadi satu rangkaian yang saling berkaitan.
    catatan: Rumusan kompetensi di CP dapat memakai taksonomi SOLO atau taksonomi lain, seperti Bloom atau Marzano, sesuai bidang keilmuan mata pelajarannya.
    dasar:
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, A. Menganalisis Capaian Pembelajaran

  - kunci: tanya-kelas-sebelumnya
    judul: Tanyakan kepada guru kelas sebelumnya sampai mana murid sudah belajar
    penjelasan: Lalu sampaikan kepada guru kelas berikutnya di mana pembelajaranmu akan berakhir.
    contoh: "Contoh di Panduan untuk Fase D (kelas VII-IX): guru kelas VIII mencari tahu dari guru kelas VII sampai mana proses belajar murid, lalu memberi tahu guru kelas IX topik terakhir yang akan ia ajarkan."
    dasar:
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, A. Menganalisis Capaian Pembelajaran, contoh pemanfaatan fase

kunci: refleksi-diri
slug: refleksi-diri
tahap: merefleksi
judul: Refleksi diri
ringkasan: Guru menilai sendiri perencanaan dan pelaksanaan pembelajarannya lewat refleksi diri, paling sedikit sekali tiap semester.
ikon: ceklis:011-bookmark
terkait: [masukan-rekan-dan-kepala-sekolah, masukan-dari-murid]
butir:
  - kunci: nilai-rencana-dan-pelaksanaan
    judul: Nilai sendiri perencanaan dan pelaksanaan pembelajaranmu
    penjelasan: Penilaian proses pembelajaran adalah asesmen terhadap rencana yang kamu susun dan cara kamu melaksanakannya.
    dasar:
      - Permendikdasmen 1/2026 Pasal 15 ayat 1 dan 2

  - kunci: tiap-semester
    judul: Lakukan setelah mengajar, paling sedikit sekali tiap semester
    penjelasan: Refleksi diri ini wajib dilakukan oleh guru yang bersangkutan.
    dasar:
      - Permendikdasmen 1/2026 Pasal 15 ayat 3 dan 4

  - kunci: pakai-data-hasil-belajar
    judul: Pakai data hasil belajar murid sebagai bahan refleksi
    penjelasan: Refleksi diri dapat mengacu pada analisis asesmen hasil belajar murid yang kamu lakukan, atau hasil asesmen berskala nasional.
    dasar:
      - Permendikdasmen 1/2026 Pasal 15 ayat 5

  - kunci: refleksi-berkesinambungan
    judul: Jadikan refleksi kebiasaan yang berkesinambungan
    penjelasan: Kompetensi kepribadian guru mencakup refleksi diri yang berkesinambungan, pola pikir bertumbuh, dan belajar sepanjang hayat.
    dasar:
      - Permendikdasmen 21/2025 Pasal 8 ayat 2 huruf b

  - kunci: refleksi-strategi
    judul: Refleksikan strategi mengajarmu dari hasil asesmen formatif
    penjelasan: Bagi guru, asesmen formatif berguna untuk merefleksikan strategi pembelajaran yang dipakai dan meningkatkan efektivitasnya.
    dasar:
      - Panduan Pembelajaran dan Asesmen edisi revisi 2025, C.2 Asesmen Formatif

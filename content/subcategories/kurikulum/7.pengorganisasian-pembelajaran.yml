id: kurikulum-pengorganisasian-pembelajaran
slug: pengorganisasian-pembelajaran
parentId: kurikulum
parentSlug: kurikulum
parentName: Kurikulum Satuan Pendidikan (KSP)
name: VIII. Pengorganisasian Pembelajaran
icon: "040-school bag.svg"
description: Struktur pelaksanaan kurikulum mulai dari intrakurikuler, kokurikuler, ekstrakurikuler, hingga pembiasaan
items:
  - id: kpp1
    title: "Intrakurikuler: Muatan, Alokasi, dan Strategi"
    description: "Memuat mata pelajaran (termasuk muatan lokal & Koding/KKA), alokasi waktu per minggu, metode/strategi pembelajaran (aktif/berbasis proyek), dan pendekatan mendalam"
  - id: kpp2
    title: "Intrakurikuler: Pengembangan Materi dan Penilaian"
    description: "Terdapat proses pengembangan materi, pemilihan sumber belajar, serta sistem dan kriteria evaluasi (formatif/sumatif)"
  - id: kpp3
    title: "Intrakurikuler: Pengembangan Kompetensi Guru"
    description: "Terdapat program pelatihan/pengembangan profesional guru serta pendampingan dan evaluasi kinerja"
  - id: kpp4
    title: "Kokurikuler: Penguatan Profil Lulusan"
    description: "Memuat 8 dimensi profil lulusan, tema proyek, elemen/sub elemen, pengaturan waktu, serta mekanisme asesmen dan pelaporannya"
  - id: kpp5
    title: "Ekstrakurikuler (Bakat dan Minat)"
    description: "Menjabarkan jenis kegiatan, tujuan spesifik, metode pelaksanaan, serta asesmen dan evaluasi ekstrakurikuler"
  - id: kpp6
    title: Pembiasaan Sekolah
    description: "Mencakup kegiatan pembiasaan yang bersifat keteladanan, terprogram, rutin, maupun spontan"

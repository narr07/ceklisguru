description: Merancang pembelajaran kolaboratif dengan ketergantungan positif dan evaluasi proses kerjasama
items:
  - id: m_cl1
    title: Rancang tugas yang memerlukan saling ketergantungan positif
    description: "Contoh: Gunakan Jigsaw dimana setiap siswa menjadi 'ahli' dan harus mengajarkan bagiannya ke kelompok"
  - id: m_cl2
    title: Tetapkan peran yang jelas dalam setiap kelompok
    description: "Contoh: Fasilitator, notulis, penyaji, pengatur waktu — rotasi peran setiap sesi untuk pemerataan"
  - id: m_cl3
    title: Evaluasi proses kerja sama, bukan hanya produk akhir
    description: "Contoh: Gunakan rubrik penilaian kolaborasi yang mencakup kontribusi, komunikasi, dan resolusi konflik"

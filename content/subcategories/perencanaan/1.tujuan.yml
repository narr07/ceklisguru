description: Menetapkan tujuan yang jelas dan memahami karakteristik peserta didik
items:
  - id: p1
    title: Identifikasi tujuan pembelajaran yang spesifik dan terukur
    description: "Contoh: Siswa dapat mengidentifikasi minimal 5 jenis kalimat majemuk dengan benar setelah pembelajaran selesai"
    tip: "Gunakan kata kerja operasional Taksonomi Bloom (C1-C6) agar kriteria keberhasilan dapat diukur secara langsung."
  - id: p2
    title: Analisis karakteristik dan kebutuhan peserta didik
    description: "Contoh: Perhatikan gaya belajar visual/auditori/kinestetik, latar belakang, dan kecepatan pemahaman setiap siswa"
    tip: "Lakukan asesmen diagnostik singkat di minggu pertama untuk memetakan kesiapan dan minat belajar siswa."
